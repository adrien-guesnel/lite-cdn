name: Release

on:
  release:
    types: [published]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push new Docker image to registry.aguesnel.fr
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Check out the repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: 🔑 Log in to registry.aguesnel.fr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: registry.aguesnel.fr
          username: ci-lite-cdn
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 🏷 Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: registry.aguesnel.fr/lite-cdn

      - name: 🛠 Build and push new Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
